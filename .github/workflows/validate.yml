name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install validation tools
        run: brew install actionlint ripgrep shellcheck
      - name: Validate GitHub Actions workflows
        run: actionlint
      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh scripts/tests/*.sh install-day-one-mac
      - name: Run complete validation
        run: scripts/validate.sh
