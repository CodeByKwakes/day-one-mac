name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform:
    name: Platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install validation tools
        run: brew install actionlint pnpm ripgrep shellcheck
      - name: Install contributor dependencies
        env:
          HUSKY: 0
        run: pnpm install --frozen-lockfile
      - name: Verify independent native plugin artifacts
        run: pnpm run test:plugins
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PULL_REQUEST_TITLE" | pnpm exec commitlint
      - name: Validate GitHub Actions workflows
        run: actionlint
      - name: Lint shell and Markdown files
        run: pnpm run lint
      - name: Validate sources and independent packages
        run: |
          pnpm run validate:static
          pnpm run test:integration
      - name: Verify pinned Skills CLI installation and lifecycle
        run: |
          SKILLS_TEST_DIR="$(mktemp -d)"
          npm install --prefix "$SKILLS_TEST_DIR" --ignore-scripts --no-audit --no-fund skills@1.7.4
          pnpm run test:skills-cli "$SKILLS_TEST_DIR/node_modules/skills/bin/cli.mjs"

  validate:
    name: validate
    needs: [platform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform check to succeed
        env:
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: test "$PLATFORM_RESULT" = success
