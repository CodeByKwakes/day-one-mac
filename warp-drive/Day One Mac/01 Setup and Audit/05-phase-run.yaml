name: "Setup · Run one phase"
command: 'day-one-mac setup --phase "{{phase}}"'
tags: ["day-one-mac", "setup", "phase", "write"]
description: "Run one required phase after its matching preview. Valid phase numbers are 01 through 08."
shells: ["zsh"]
arguments:
  - name: phase
    description: "Required phase number from 01 through 08."
    default_value: "01"
